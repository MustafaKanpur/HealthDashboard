<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitalis — Clinician Risk Dashboard</title>
    <script>
      // Applies the saved (or OS) theme before first paint, so a dark-mode
      // user never sees a white flash while the bundle loads. Mirrors
      // preferredTheme() in src/components/ui/useTheme.js.
      (function () {
        try {
          var saved = localStorage.getItem('vitalis-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
